name: Build BuildGeometry Pro

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Build with Gradle
        run: ./gradlew test build --no-daemon

      - name: Upload Mod Jar Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-geometry-pro-jar
          path: build/libs/*.jar
